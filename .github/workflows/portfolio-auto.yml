name: Actualiser le portfolio

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/generate-portfolio.py"
      - ".github/workflows/portfolio-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-auto
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Générer le manifeste des séries
        run: python scripts/generate-portfolio.py
      - name: Enregistrer le manifeste si nécessaire
        run: |
          if git diff --quiet -- images-manifest.json; then
            echo "Le manifeste est déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images-manifest.json
          git commit -m "chore: actualiser les séries et photos"
          git push
