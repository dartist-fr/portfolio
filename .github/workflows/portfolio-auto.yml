name: Actualiser le portfolio

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/generate-portfolio.py"
      - "scripts/convert-jpg-to-webp.py"
      - "scripts/optimize-images.py"
      - ".github/workflows/portfolio-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-auto
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer les outils de conversion
        run: python -m pip install --upgrade Pillow
      - name: Convertir les JPG en WebP
        run: python scripts/convert-jpg-to-webp.py
      - name: Générer le manifeste des séries
        run: python scripts/generate-portfolio.py
      - name: Générer les versions légères
        run: python scripts/optimize-images.py
      - name: Enregistrer les changements si nécessaire
        run: |
          if git diff --quiet -- images/ images-opt/ images-manifest.json && [ -z "$(git ls-files --others --exclude-standard images-opt/)" ]; then
            echo "Le portfolio est déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/ images-opt/ images-manifest.json
          git commit -m "chore: mettre à jour le portfolio"
          git push
